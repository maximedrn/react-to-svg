name: Continuous Integration

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Lint check
        run: bun run lint:check

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Check package
        run: bun run check:package

      - name: Check exports
        run: bun run check:exports

  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Pack tarball
        run: npm pack --pack-destination "${{ runner.temp }}"

      - name: Smoke test - Node ${{ matrix.node }}
        working-directory: ${{ runner.temp }}
        run: |
          npm init --yes
          npm install ./*.tgz react react-dom effect
          cp "$GITHUB_WORKSPACE/scripts/smoke.mjs" .
          node smoke.mjs
